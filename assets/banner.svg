<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#141926"/>
    </linearGradient>

    <!-- Card & Element Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2035" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#121624" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252d43" stroke-width="0.7" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#4f5b7d" fill-opacity="0.4"/>
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.12); }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbMove {
        0% { transform: translate(0, 0); }
        50% { transform: translate(40px, -25px); }
        100% { transform: translate(0, 0); }
      }
      .animated-float-1 { animation: floatSlow 6s ease-in-out infinite; }
      .animated-float-2 { animation: floatReverse 7s ease-in-out infinite; }
      .animated-glow-1 { animation: pulseGlow 5s ease-in-out infinite; transform-origin: 200px 100px; }
      .animated-glow-2 { animation: pulseGlow 6s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
      .animated-line { stroke-dasharray: 8 6; animation: dashStream 25s linear infinite; }
      .animated-orb { animation: orbMove 10s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Workspace Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Glowing Background Orbs -->
  <g class="animated-orb">
    <circle cx="180" cy="90" r="130" fill="#6366f1" filter="url(#glow)" class="animated-glow-1"/>
    <circle cx="1020" cy="310" r="140" fill="#ec4899" filter="url(#glow)" class="animated-glow-2"/>
    <circle cx="920" cy="110" r="100" fill="#06b6d4" opacity="0.35" filter="url(#glow)"/>
    <circle cx="280" cy="340" r="90" fill="#8b5cf6" opacity="0.25" filter="url(#glow)"/>
  </g>

  <!-- Connecting Animated Cyber Lines (Behind Foreground Content) -->
  <path d="M 80,310 Q 300,380 600,340 T 1120,290" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" class="animated-line"/>
  <path d="M 120,90 Q 500,40 850,90 T 1100,160" fill="none" stroke="url(#cyanGrad)" stroke-width="1.8" opacity="0.35" class="animated-line"/>

  <!-- Left Dynamic Cloud IDE Chip (Subtle Floating Element in Background) -->
  <g class="animated-float-1" opacity="0.85">
    <rect x="70" y="55" width="220" height="75" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.2"/>
    <circle cx="95" cy="80" r="6" fill="#ef4444"/>
    <circle cx="112" cy="80" r="6" fill="#f59e0b"/>
    <circle cx="129" cy="80" r="6" fill="#10b981"/>
    <text x="95" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">&gt; devcontainer up --ready</text>
  </g>

  <!-- Right Dynamic Remote Workspace Terminal Chip (Subtle Floating Element) -->
  <g class="animated-float-2" opacity="0.85">
    <rect x="910" y="270" width="225" height="80" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.2"/>
    <text x="930" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" font-weight="600">⚡ WebContainer Active</text>
    <text x="930" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Ports: 3000, 8080 forwarded</text>
    <circle cx="1105" cy="298" r="4" fill="#22c55e" filter="url(#softGlow)"/>
  </g>

  <!-- Centered Foreground Header Content (Title & Subtitle Always in Foreground) -->
  <!-- Top Category Pill -->
  <g transform="translate(600, 85)">
    <rect x="-185" y="-18" width="370" height="36" rx="18" fill="url(#badgeGrad)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c7d2fe" letter-spacing="1.2">
      🚀 CLOUD IDE &amp; DEVELOPER WORKSPACES
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 160)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Cloud IDE &amp; Dev Workspaces
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 202)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a3b8">
      Curated Catalog of SaaS Platforms, Self-Hosted CDEs &amp; Remote Coding Frameworks
    </text>
  </g>

  <!-- Gradient Divider -->
  <g transform="translate(600, 224)">
    <rect x="-240" y="0" width="480" height="2.5" rx="1.5" fill="url(#accentGrad)"/>
  </g>

  <!-- Feature Value Badges (Bottom Center) -->
  <g transform="translate(600, 280)">
    <!-- Badge 1: SaaS & CDEs -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="-18" width="190" height="36" rx="10" fill="#1e2438" stroke="#334155" stroke-width="1.2"/>
      <text x="95" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        ☁️ SaaS &amp; Turnkey CDEs
      </text>
    </g>

    <!-- Badge 2: Open Source -->
    <g transform="translate(-105, 0)">
      <rect x="0" y="-18" width="210" height="36" rx="10" fill="#1e2438" stroke="#334155" stroke-width="1.2"/>
      <text x="105" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        ⭐ Top Open-Source Repos
      </text>
    </g>

    <!-- Badge 3: Market Metrics -->
    <g transform="translate(130, 0)">
      <rect x="0" y="-18" width="190" height="36" rx="10" fill="#1e2438" stroke="#334155" stroke-width="1.2"/>
      <text x="95" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        📊 Pricing &amp; Scale Data
      </text>
    </g>
  </g>

  <!-- Modern Accent Bottom Border -->
  <rect x="0" y="415" width="1200" height="5" rx="2.5" fill="url(#accentGrad)"/>
</svg>
